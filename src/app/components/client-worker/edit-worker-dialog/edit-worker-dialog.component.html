<div class="modal-width">
  <h2 mat-dialog-title>Edit Worker</h2>
  <mat-dialog-content [formGroup]="form">
    <div class="row pb-4">
      <div class="col-lg-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Name</mat-label>
          <input matInput required
                 formControlName="name">
        </mat-form-field>
      </div>
    </div>
    <div class="row pb-4">
      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Locations</mat-label>
          <mat-select formControlName="locationIds" multiple>
            <mat-option *ngFor="let location of allLocationsList" [value]="location.id">
              {{location.name}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Worker Group</mat-label>
          <mat-select formControlName="workerGroupId">
            <mat-option *ngFor="let workerGroup of allwgGroupsList" [value]="workerGroup.id">
              {{workerGroup.name}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <div class="row pb-4">
      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Worker Code</mat-label>
          <input matInput
                 formControlName="workerCode"
                 maxlength="2"
                 minlength="2"
          >
        </mat-form-field>
      </div>
      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Hourly rate</mat-label>
          <input matInput
                 formControlName="hourlyRate" type="number" placeholder="0.00" step="0.01" class="currency-input">
          <span matTextPrefix>€&nbsp;</span>
        </mat-form-field>
      </div>
    </div>
    <div class="row pb-4">
      <div class="col-lg-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Notes</mat-label>
                 <textarea matInput formControlName="notes"></textarea>
        </mat-form-field>
      </div>
    </div>
    <div class="row pb-4">
      <div class="col-lg-12">
        <mat-slide-toggle
        class="left_handed_toggle"
        formControlName="isLeftHanded">
        <mat-label>Left Handed</mat-label>
      </mat-slide-toggle>
      </div>
    </div>
  </mat-dialog-content>
  <div >
    <mat-dialog-actions>
      <button mat-stroked-button color="accent" (click)="close()" (click)="close()">Close</button>
      <button mat-raised-button color="primary" (click)="updateWorker()" style="margin-left: 20px;">Save Changes
      </button>
    </mat-dialog-actions>
  </div>
</div>
