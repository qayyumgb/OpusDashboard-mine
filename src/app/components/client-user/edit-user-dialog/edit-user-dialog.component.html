<div class="modal-width">
  <h2 mat-dialog-title>Edit User</h2>
    <mat-dialog-content [formGroup]="editUserForm">
      <div class="row pb-4">
        <div class="col-lg-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Name</mat-label>
            <input matInput required formControlName="name">
        </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput disabled value="{{userRecordBeingEdited?.email}}">
          </mat-form-field>
        </div>
        
      </div>
        <!-- <mat-label style="font-size: 1rem;">{{userRecordBeingEdited?.email}}<em style="font-size: 0.8rem;"> (not editable)</em></mat-label>
        <div style="height: 0.4rem;">&nbsp;</div> -->
      <div class="row pb-4">
        <div class="col-lg-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Notes</mat-label>
            <textarea matInput formControlName="notes"></textarea>
        </mat-form-field>
        </div>
      </div>
      <div class="row pb-4">
        <div class="col-lg-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Role</mat-label>
            <mat-select formControlName="role">
                <mat-option value="regular">regular</mat-option>
                <mat-option value="manager">manager</mat-option>
                <mat-option value="admin">admin</mat-option>
            </mat-select>
        </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Language</mat-label>
            <mat-select formControlName="languageCode">
              <mat-option *ngFor="let language of languagesList" [value]="language.code">{{language.name}}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div class="row pb-4">
        <div class="col-lg-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Associated worker</mat-label>
            <mat-select formControlName="associatedWorkerId">
              <mat-option *ngFor="let worker of allWorkersList" [value]="worker.id">{{ worker.name }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </mat-dialog-content>
    <div>
        <mat-dialog-actions>
            <button mat-stroked-button color="accent" (click)="close()">Close</button>
            <button mat-raised-button color="primary" (click)="updateUser()" style="margin-left: 20px;">Save Changes</button>
        </mat-dialog-actions>
    </div>
</div>
