<div style="min-width: 400px;">
    <h2 mat-dialog-title style="text-align: center; text-decoration: underline; font-size: 1.2rem; margin-bottom: 1rem;">Create User</h2>

    <mat-dialog-content [formGroup]="form" style="text-align: center;">
        <mat-form-field>
            <mat-label>Name</mat-label>
            <input matInput required
                   formControlName="name">
        </mat-form-field>
        <br/>
        <mat-form-field style="margin-top: 0.4rem">
          <mat-label>Email</mat-label>
            <input matInput required
                   formControlName="email">
        </mat-form-field>
        <br/>
        <mat-form-field style="margin-top: 0.4rem">
          <mat-label>Notes</mat-label>
            <input matInput
                   formControlName="notes">
        </mat-form-field>
        <br/>
        <mat-form-field appearance="fill"  style="margin-top: 0.4rem">
            <mat-label>Select role</mat-label>
            <mat-select formControlName="role">
                <mat-option value="regular">regular</mat-option>
                <mat-option value="manager">manager</mat-option>
                <mat-option value="admin">admin</mat-option>
            </mat-select>
        </mat-form-field>
        <br/>
    </mat-dialog-content>
    <div style="text-align: center;margin-bottom: 0.8rem;">
        <mat-dialog-actions>
            <button mat-raised-button color="primary" (click)="close()">Close</button>
            <button mat-raised-button color="primary" (click)="createUser()" style="margin-left: 20px;">Create User</button>
        </mat-dialog-actions>
    </div>
</div>
