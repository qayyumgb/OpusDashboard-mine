<div class="modal-width">
  <h2 mat-dialog-title>Create User</h2>

  <mat-dialog-content [formGroup]="form">
    <div class="row pb-4">
      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Name</mat-label>
          <input matInput required formControlName="name">
        </mat-form-field>
      </div>
      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email</mat-label>
          <input matInput required
                 formControlName="email">
        </mat-form-field>
      </div>
    </div>
    <div class="row pb-4">
      <div class="col-lg-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Notes</mat-label>
          <!-- <input matInput formControlName="notes"> -->
          <textarea matInput formControlName="notes"></textarea>
        </mat-form-field>
      </div>
    </div>
    <div class="row pb-4">
      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option value="regular">regular</mat-option>
            <mat-option value="manager">manager</mat-option>
            <mat-option value="admin">admin</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Language</mat-label>
          <mat-select formControlName="languageCode">
            <mat-option *ngFor="let language of languagesList" [value]="language.code">{{ language.name }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    
    <div class="row pb-4">
      <div class="col-lg-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Associated worker</mat-label>
          <mat-select formControlName="associatedWorkerId">
            <mat-option *ngFor="let worker of allWorkersList" [value]="worker.id">{{ worker.name }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>
  <div >
    <mat-dialog-actions>
      <button mat-stroked-button color="accent" (click)="close()">Close</button>
      <button mat-raised-button color="primary" (click)="createUser()" style="margin-left: 20px;">Create User</button>
    </mat-dialog-actions>
  </div>
</div>
