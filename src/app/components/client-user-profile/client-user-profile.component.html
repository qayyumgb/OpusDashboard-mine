<div style="margin-left: 30%; margin-top: 2rem; margin-bottom: 1rem;display: flex;align-items: baseline;">
    <mat-form-field style="width: 12rem; margin-right: 3rem;height: 2.5rem;">
        <input matInput required
               placeholder="Name"
               [(ngModel)]="name"
        >
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="updateUser()" style="margin-top: 1rem;">Save Changes</button>
</div>
<mat-divider style="max-width: 70%"></mat-divider>
<div class="listing-container-roles">
    <div style="text-align: center;font-size: 1.35rem;font-weight: 500;margin-bottom: 2rem;">Client Roles Mapping</div>
    <table
            mat-table
            [dataSource]="dataSource"
            multiTemplateDataRows
            matSort
            class="listing-table"
    >
        <ng-container
                matColumnDef="{{ column }}"
                *ngFor="let column of columnsToDisplay"
        >
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                {{ clientAttributesReadableMap.get(column) }}
            </th>
            <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="columnsHeadersToDisplay"></tr>
        <tr mat-row *matRowDef="let element; columns: columnsHeadersToDisplay" class="row"></tr>
    </table>
</div>
