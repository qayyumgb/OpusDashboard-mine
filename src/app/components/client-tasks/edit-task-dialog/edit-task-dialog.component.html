<div style="min-width: 400px;">
  <h2 mat-dialog-title style="text-align: center; text-decoration: underline; font-size: 1.2rem;">Edit Task</h2>

  <mat-dialog-content [formGroup]="editTaskForm" style="text-align: center;">
    <div *ngIf="taskRecordBeingEdited.isPauseTask">This is a common Pause task for wearables and can't be deleted</div>
    <br/>
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput required
             formControlName="name">
    </mat-form-field>
    <br/>
    <mat-form-field appearance="fill" style="margin-top: 0.5rem;">
      <mat-label>Task Groups</mat-label>
      <mat-select formControlName="taskGroupIds" multiple>
        <mat-option *ngFor="let taskGroup of allTaskGroupsList" [value]="taskGroup.id">
          {{taskGroup.name}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <br/>
    <mat-form-field appearance="fill" style="margin-top: 0.5rem;">
      <mat-label>Target device</mat-label>
      <mat-select formControlName="deviceTarget" required multiple>
        <mat-option *ngFor="let targetDevice of allTargetDevicesList" [value]="targetDevice.id">
          {{targetDevice.name}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <br/>
    <mat-form-field appearance="fill" style="margin-top: 0.5rem;">
      <mat-label>Function</mat-label>
      <mat-select formControlName="func" required>
        <mat-option *ngFor="let funcObj of allFunctionsList" [value]="funcObj.id">
          {{funcObj.name}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <br/>
  </mat-dialog-content>
  <br/>
  <div style="text-align: center;margin-bottom: 0.4rem;">
    <mat-dialog-actions>
      <button mat-raised-button color="primary" (click)="close()">Close</button>
      <button mat-raised-button color="primary" (click)="updateTask()" style="margin-left: 20px;">Save Changes</button>
    </mat-dialog-actions>
  </div>
</div>
