<div class="page-top-space">
  <mat-card class="page-main-card">
    <mat-card-content>
      <div class="d-flex align-item-center page-action">
        <div class="choose-date" *ngIf="selectedClientDocData">
          <button mat-icon-button class="matMini-icon-btn" (click)="decrementMonth()" [disabled]="isButtonDisabled()">
            <mat-icon>keyboard_double_arrow_left</mat-icon>
          </button>
          <button mat-icon-button class="matMini-icon-btn"  (click)="incrementDate()" [disabled]="isButtonDisabled()">
            <mat-icon>chevron_left</mat-icon>
          </button>
          
          
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Choose a date</mat-label>
            <input matInput [matDatepickerFilter]="futureFilter" (dateChange)="onDateChange()"
                   [(ngModel)]="selectedDate" [matDatepicker]="picker">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
          <button mat-icon-button (click)="decrementDate()" class="matMini-icon-btn" (click)="incrementDate()" [disabled]="isButtonDisabled()">
            <mat-icon>chevron_right</mat-icon>
          </button>
          <button mat-icon-button (click)="incrementMonth()" class="matMini-icon-btn" (click)="incrementMonth()" [disabled]="isButtonDisabled()">
            <mat-icon>keyboard_double_arrow_right</mat-icon>
          </button>
          
        </div>
        <nav class="tabs-selection" mat-tab-nav-bar mat-align-tabs="center"
        [tabPanel]="tabPanel">
        <a mat-tab-link label="ROW MAP" (click)="navigateToRowMapTab()"
        [active]="tabIndex === 0">
       ROW MAP
     </a>
     <a mat-tab-link label="ROW" (click)="navigateToRowTab()"
        [active]="tabIndex === 1">
       ROW
     </a>
     <a mat-tab-link label="VARIETY" (click)="navigateToVarietyTab()"
        [active]="tabIndex === 2">
       VARIETY
     </a>
        </nav>
      </div>
      
      <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
<router-outlet></router-outlet>
    </mat-card-content>
  </mat-card>
 

</div>
