<div style="min-width: 500px;">
  <h2 mat-dialog-title>Edit Location</h2>
    <mat-dialog-content [formGroup]="editLocationForm" style="text-align: center;">
      <div >
        <div class="row">
            <div class="col-lg-12">
                <mat-form-field class="w-100" appearance="outline">
                    <mat-label>Name</mat-label>
                    <input matInput required formControlName="name"/>
                </mat-form-field>
            </div>
        </div>
        <h2 class="mt-3">Row Reference</h2>
        <div class="row">
            <div class="col-lg-6">
                <mat-form-field class="w-100" appearance="outline">
                    <mat-label>Latitude</mat-label>
                    <input type="number" #latitude matInput formControlName="entrancePointLatitude">
                </mat-form-field>
            </div>
            <div class="col-lg-6">
                <mat-form-field class="w-100" appearance="outline">
                    <mat-label>Longitude</mat-label>
                    <input type="number" #longitude matInput formControlName="entrancePointLongitude">
                </mat-form-field>
            </div>
        </div>
        <a class="hint" (click)="openInGoogleMap(latitude.value, longitude.value)">Click here to open in Google Map</a>
        <h2 class="mt-3">Trolley Numbers</h2>
        <div class="row">
            
            <div class="col-lg-6">
                <mat-form-field class="w-100" appearance="outline">
                    <mat-label>Start</mat-label>
                    <input type="number" matInput formControlName="trolleysStart">
                </mat-form-field>
            </div>
            <div class="col-lg-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Last</mat-label>
                    <input type="number" matInput formControlName="trolleysEnd">
                </mat-form-field>
            </div>
        </div>
    </div>
    </mat-dialog-content>
    <br/>
    <div style="text-align: right; margin-bottom: 0.8rem;">
        <mat-dialog-actions>
            <button mat-stroked-button color="accent" (click)="close()">Cancel</button>
            <button mat-raised-button color="primary" (click)="updateLocation()" style="margin-left: 20px;">Update
                Location
            </button>
        </mat-dialog-actions>
    </div>
</div>
