
<div style="min-width: 600px;">
    <!-- <h2 mat-dialog-title style="text-align: center; text-decoration: underline; font-size: 1.2rem; margin-bottom: 1rem;">Edit Layout</h2> -->
    <h2 mat-dialog-title>Create Layout</h2>
    <mat-dialog-content [formGroup]="createLayoutForm" style="text-align: center;">
        <div class="layout-modal-wrapper">
            <div class="row mb-3">
                <div class="col-lg-12">
                    <mat-form-field class="w-100" appearance="outline">
                        <mat-label>Name</mat-label><input matInput required formControlName="name">
                        
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <mat-form-field class="w-100" appearance="outline">
                        <mat-label>Row width</mat-label><input matInput required formControlName="rowWidth">
                        <div matSuffix class="mat-suffix">meter</div>
                    </mat-form-field>
                </div>
            </div>
            <h2 class="mt-3">Row Refrence</h2>
            <h3 class="mt-1">First Row</h3>
            <div class="row grid-row">
                <div class="col-md-4 ">
                    <mat-form-field class="w-100" appearance="outline">
                        <mat-label>Row Refrence</mat-label> <input matInput formControlName="firstRowNumber">
                    </mat-form-field>
                </div>
                <div class="col-md-4">
                    <mat-form-field class="w-100" appearance="outline">
                        <mat-label>Latitude</mat-label><input type="number" matInput #latitude1 formControlName="firstRowLatitude">
                    </mat-form-field>
                </div>
                <div class="col-md-4">
                    <mat-form-field class="w-100" appearance="outline">
                        <mat-label>Longitude</mat-label><input type="number" matInput #longitude1 formControlName="firstRowLongitude">
                    </mat-form-field>
                </div>
            </div>
            <a class="hint" (click)="openInGoogleMap(latitude1.value, longitude1.value)">Click here to open in Google Map</a>

            <h3 class="mt-1">Last Row</h3>
            <div class="row grid-row">
                <div class="col-md-4">
                    <mat-form-field class="w-100" appearance="outline">
                        <mat-label>Row Refrence</mat-label> <input matInput formControlName="secondRowNumber">
                    </mat-form-field>
                </div>
                <div class="col-md-4">
                    <mat-form-field class="w-100" appearance="outline">
                        <mat-label>Latitude</mat-label><input type="number" #latitude2 matInput  formControlName="secondRowLatitude">
                    </mat-form-field>
                </div>
                <div class="col-md-4">
                    <mat-form-field class="w-100" appearance="outline">
                        <mat-label>Longitude</mat-label><input type="number" #longitude2 matInput  formControlName="secondRowLongitude">
                    </mat-form-field>
                </div>
            </div>
            <a class="hint" (click)="openInGoogleMap(latitude2.value, longitude2.value)">Click here to open in Google Map</a>
        </div>
    </mat-dialog-content>
    <br><br>
    <div style="text-align: right;">
        <mat-dialog-actions>
            <button mat-stroked-button color="accent" (click)="close()">Close</button>
            <button mat-raised-button color="primary"
                    (click)="createLayout()" style="margin-left: 20px;"
            *ngIf="selectedClientDocData?.hasAdminRole">Create Layout</button>
        </mat-dialog-actions>
    </div>
</div>
