<div style="min-width: 400px;">
  <h2 mat-dialog-title style="text-align: center; text-decoration: underline; font-size: 1.2rem;">Edit Task Group</h2>

  <mat-dialog-content [formGroup]="editTaskGroupForm" style="text-align: center;">
    <br/>
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput required
             formControlName="name">
    </mat-form-field>
    <br/>
  </mat-dialog-content>
  <br/>
  <div style="text-align: center;margin-bottom: 0.4rem;">
    <mat-dialog-actions>
      <button mat-raised-button color="primary" (click)="close()">Close</button>
      <button mat-raised-button color="primary" (click)="updateTaskGroup()" style="margin-left: 20px;">Save Changes</button>
    </mat-dialog-actions>
  </div>
</div>
