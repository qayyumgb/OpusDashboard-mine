<button mat-fab color="accent" (click)="openDialog()"
        *ngIf="selectedClientDocData?.hasAdminRole" class="fab">
  <mat-icon
    matTooltip="Create new Task Group"
    matTooltipClass="tooltip-class"
    matTooltipHideDelay="100000"
    style="width: 44px; height: 24px">
    add
  </mat-icon>
</button>

<div class="listing-container">
  <mat-form-field appearance="outline" class="listing-filter-with-archival">
    <mat-icon matPrefix>search</mat-icon>
    <mat-label style="color: #808080FF">Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" [(ngModel)]="filterValue" placeholder="name" #input/>
  </mat-form-field>
  <div
    style="margin-left: 1rem;
    float: left;
    vertical-align: bottom;
    margin-top: 0.8rem;
    border: 1px #ffffff4d solid;
    border-radius: 5px;
    display: inline-block;">
    <mat-button-toggle-group #group="matButtonToggleGroup" [(ngModel)]="unArchivedVsArchived"
                             style="height: 2.15rem;padding-top: 0;" (change)="toggleArchived()">
      <mat-button-toggle value="unarchived" aria-label="Text align left">
        <mat-icon
          style="transform: scale(1);cursor: pointer;color: whitesmoke;margin-top: -1rem;"
          matTooltip="Show Task Groups"
          matTooltipClass="tooltip-class"
          matTooltipHideDelay="100"
          matTooltipPosition="below"
        >list
        </mat-icon>
      </mat-button-toggle>
      <mat-button-toggle value="archived" aria-label="Text align center">
        <mat-icon
          style="transform: scale(1);cursor: pointer;color: whitesmoke;margin-top: -1rem;"
          matTooltip="Show archived task groups"
          matTooltipClass="tooltip-class"
          matTooltipHideDelay="100"
          matTooltipPosition="below"
        >archive
        </mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>
  <div style="clear: both; font-size: 1.1rem;padding-left: 0.2rem;margin-bottom: 0.25rem;"
       *ngIf="areArchivedTaskGroupsShown()">Archived Task Groups
  </div>
  <div class="mat-elevation-z8" style="clear:both;">
    <table
      class="listing-table"
      mat-table
      [dataSource]="dataSource"
      multiTemplateDataRows
      matSort
    >
      <ng-container
        matColumnDef="{{ column }}"
        *ngFor="let column of columnsToDisplay"
      >
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          {{ taskAttributesReadableMap.get(column) }}
        </th>
        <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
      </ng-container>

      <ng-container matColumnDef="Edit">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element" class="listing-table-tools">
          <button
            mat-icon-button
            color="accent"
            (click)="openEditDialog(element)"
            class="listing-table-tools"
            [disabled]="!selectedClientDocData?.hasAdminRole"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="accent"
            (click)="archiveTaskGroup(element)"
            class="listing-table-tools"
            *ngIf="!element.isArchived">
            <mat-icon matTooltip="Archive task group"
                      matTooltipClass="tooltip-class"
                      matTooltipHideDelay="100"
                      matTooltipPosition="below"
                      style="width: 44px; height: 24px">archive
            </mat-icon>
          </button>
          <button
            mat-icon-button
            color="accent"
            (click)="unarchiveTaskGroup(element)"
            class="listing-table-tools"
            *ngIf="element.isArchived">
            <mat-icon matTooltip="Unarchive this task group"
                      matTooltipClass="tooltip-class"
                      matTooltipHideDelay="100"
                      matTooltipPosition="below"
                      style="width: 44px; height: 24px">unarchive
            </mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnsHeadersToDisplay"></tr>
      <tr
        mat-row
        *matRowDef="let element; columns: columnsHeadersToDisplay"
      ></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 25, 100]"
      [pageSize]="25"
      [showFirstLastButtons]="true"
    ></mat-paginator>
  </div>
</div>
