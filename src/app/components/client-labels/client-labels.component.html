<div class="listing-container">
  <div class="controls-container">
    <div class="date-container">
      <mat-form-field appearance="outline" class="listing-filter-with-archival">
        <mat-icon matPrefix>search</mat-icon>
        <mat-label style="color: gray">Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" [(ngModel)]="filterValue" placeholder="name" #input />
      </mat-form-field>
    </div>
    <button mat-flat-button color="primary" class="setting-add-button mr-3" (click)="openDialog()"
      *ngIf="selectedClientDocData?.hasAdminRole">
      <mat-icon matTooltip="Create Label" matTooltipClass="tooltip-class" matTooltipHideDelay="100000">
        add
      </mat-icon> Create new Label</button>
    <div>
      <mat-button-toggle-group #group="matButtonToggleGroup" [(ngModel)]="unArchivedVsArchived"
        (change)="toggleArchived()">
        <mat-button-toggle value="unarchived" aria-label="Text align left">
          <mat-icon matTooltip="Show labels" matTooltipClass="tooltip-class" matTooltipHideDelay="100"
            matTooltipPosition="below">list
          </mat-icon>
        </mat-button-toggle>
        <mat-button-toggle value="archived" aria-label="Text align center">
          <mat-icon matTooltip="Show archived labels" matTooltipClass="tooltip-class" matTooltipHideDelay="100"
            matTooltipPosition="below">archive
          </mat-icon>
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </div>

  <div class="table-card">
    <div *ngIf="areArchivedLabelsShown()">Archived Labels
    </div>
    <div class="mat-elevation-z8" style="clear:both;">
      <table class="listing-table" mat-table [dataSource]="dataSource" multiTemplateDataRows matSort>
        <ng-container matColumnDef="{{ column }}" *ngFor="let column of columnsToDisplay">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            {{ labelAttributesReadableMap.get(column) }}
          </th>
          <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
        </ng-container>

        <ng-container matColumnDef="Edit">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let element" class="listing-table-tools">
            <button mat-icon-button color="accent" (click)="openEditDialog(element)" class="listing-table-tools"
              [disabled]="!selectedClientDocData?.hasAdminRole">
              <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button color="accent" (click)="archiveLabel(element)" class="listing-table-tools"
              *ngIf="!element.isArchived">
              <mat-icon matTooltip="Archive this label" matTooltipClass="tooltip-class" matTooltipHideDelay="100"
                matTooltipPosition="below">archive
              </mat-icon>
            </button>
            <button mat-icon-button color="accent" (click)="unarchiveLabel(element)" class="listing-table-tools"
              *ngIf="element.isArchived">
              <mat-icon matTooltip="Unarchive this label" matTooltipClass="tooltip-class" matTooltipHideDelay="100"
                matTooltipPosition="below">unarchive
              </mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnsHeadersToDisplay"></tr>
        <tr mat-row *matRowDef="let element; columns: columnsHeadersToDisplay"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="25" [showFirstLastButtons]="true"></mat-paginator>
    </div>
  </div>

</div>
