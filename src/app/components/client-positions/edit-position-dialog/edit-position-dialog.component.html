<div style="min-width: 400px;">
  <h2 mat-dialog-title>Edit Position</h2>

  <mat-dialog-content [formGroup]="editPositionForm" style="text-align: center;">
    <div class="row pb-4">
      <div class="col-lg-12">
        <mat-form-field class="w-100">
          <mat-label>Name</mat-label>
          <input matInput required
                 formControlName="name">
        </mat-form-field> 
      </div>
    </div>
   <div class="row">
    <div class="col-lg-12">
      <mat-form-field class="w-100">
        <mat-label>Select Location</mat-label>
        <mat-select formControlName="locationId">
          <mat-option [value]="null">Select Location</mat-option>
          <mat-option *ngFor="let location of allLocationsList" [value]="location.id">
            {{location.name}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
   </div>
  </mat-dialog-content> 
  <div>
    <mat-dialog-actions class="w-100">
      <button mat-stroked-button color="accent" (click)="close()">Close</button>
      <button mat-raised-button color="primary" (click)="updatePosition()" style="margin-left: 20px;">Save Changes</button>
    </mat-dialog-actions>
  </div>
</div>
